<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Restablecer contraseña · Nexo</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='portal.css') }}">
  <script src="{{ url_for('static', filename='portal.js') }}" defer></script>
</head>
<body>
  <div class="content login-panel" role="main">
    <p class="eyebrow">ACCESO A TU CUENTA</p>
    <h1>Restablecer contraseña</h1>
    <div id="notice" role="status" aria-live="polite" hidden></div>
    <form id="reset-form" class="card" method="post" hidden>
      <label for="reset-password">Nueva contraseña</label>
      <input id="reset-password" name="new_password" type="password" minlength="12" maxlength="256"
             autocomplete="new-password" aria-describedby="password-hint" required>
      <small class="hint" id="password-hint">Al menos 12 caracteres.</small>
      <button type="submit">Actualizar contraseña <span>→</span></button>
    </form>
    <a class="text-link" href="/">← Volver al portal</a>
  </div>
</body>
</html>
